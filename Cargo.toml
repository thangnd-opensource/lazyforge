[package]
name = "lazyforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A lazygit-style terminal UI for GitLab and GitHub: merge/pull requests, pipelines and branches"
license = "MIT"
readme = "README.md"
repository = "https://github.com/thangnd-opensource/lazyforge"
keywords = ["gitlab", "github", "tui", "merge-request", "pull-request"]
categories = ["command-line-utilities"]

[dependencies]
ansi-to-tui = "8"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
keyring = "4.2.0"
open = "5.4.4"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2", "form"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
wiremock = "0.6.5"
